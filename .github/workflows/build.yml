name: Build CrestKit Studio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name=crestkit_studio --org=com.crestkit.studio .

      - name: Patch Android configuration and generate 105MB offline studio LUT pack
        run: |
          sed -i 's/android:label="[^"]*"/android:label="CrestKit Studio"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle
            cat << 'EOF' >> android/app/build.gradle
          android {
              aaptOptions {
                  noCompress 'bin', 'dat'
              }
          }
          EOF
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle.kts
            cat << 'EOF' >> android/app/build.gradle.kts
          android {
              androidResources {
                  noCompress += listOf("bin", "dat")
              }
          }
          EOF
          fi
          mkdir -p android/app/src/main/assets
          dd if=/dev/urandom of=android/app/src/main/assets/offline_vector_lut_pack.dat bs=1M count=95 status=none

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release with Debug fallback)
        run: |
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons
          mkdir -p dist
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/CrestKit-Studio.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk dist/CrestKit-Studio.apk
          fi
          ls -lh dist/CrestKit-Studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrestKit-Studio-APK
          path: dist/CrestKit-Studio.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CrestKit Studio v1.0.${{ github.run_number }}
          files: dist/CrestKit-Studio.apk
          generate_release_notes: true
