name: crestkit_studio
description: 2D Vector Crest & Jersey Mockup Studio with built-in asset library.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  pdf: ^3.11.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
